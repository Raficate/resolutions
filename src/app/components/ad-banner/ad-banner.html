<div class="ad-slot" aria-label="Publicidad">
  @if (isBrowser && adsenseClient) {
    @if (adSlot) {
      <!-- Unidad de anuncio específica -->
      <ins class="adsbygoogle"
           style="display:block"
           [attr.data-ad-client]="adsenseClient"
           [attr.data-ad-slot]="adSlot"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    } @else {
      <!-- Espacio para anuncios automáticos -->
      <ins class="adsbygoogle"
           style="display:block; min-height:90px"
           [attr.data-ad-client]="adsenseClient"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    }
  } @else {
    <!-- Placeholder visible en desarrollo o sin configuración -->
    <div class="ad-placeholder">
      <span>Espacio para anuncio</span>
      <small>970×90 (desktop) · 728×90 · 320×50 (mobile)</small>
    </div>
  }
</div>
