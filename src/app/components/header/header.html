<header class="main-header">
  <img src="mountain.png" alt="Logo" class="header-logo">
  <h1>{{ 'header.title' | transloco }}</h1>

  @if (user$ | async; as user) {
    <div class="header-search">
      <span class="material-symbols-outlined search-icon">search</span>
      <input
        type="search"
        class="search-input"
        [value]="searchService.searchTerm()"
        (input)="onSearchInput($event)"
        [placeholder]="'header.searchPlaceholder' | transloco"
        [attr.aria-label]="'header.searchPlaceholder' | transloco">
      @if (searchService.searchTerm()) {
        <button type="button" class="search-clear" (click)="clearSearch()" [attr.aria-label]="'header.clearSearch' | transloco">
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
  }

  <div class="auth-section">
    @if (user$ | async; as user) {
      <div class="user-menu-container">
        <button class="user-trigger" (click)="toggleMenu()">
          @if (user.photoURL) {
            <img [src]="user.photoURL" [alt]="user.displayName" class="user-avatar" referrerpolicy="no-referrer">
          } @else {
            <div class="user-avatar-placeholder">
              <span class="material-symbols-outlined">person</span>
            </div>
          }
          <span class="user-name">{{ user.displayName || user.email }}</span>
          <span class="material-symbols-outlined dropdown-icon" [class.open]="menuOpen()">expand_more</span>
        </button>

        @if (menuOpen()) {
          <div class="user-dropdown">
            <button class="dropdown-item" (click)="logout()">
              <span class="material-symbols-outlined">logout</span>
              {{ 'header.logout' | transloco }}
            </button>
          </div>
        }
      </div>
    } @else {
      <button class="btn-login" (click)="login()">
        <span class="material-symbols-outlined">login</span>
        {{ 'header.login' | transloco }}
      </button>
    }
  </div>
</header>
